
eks:
  schema_version: 1
  configuration_model: system_user_profiles

  # Kubernetes y región autorizados
  kubernetes:
    allowed_versions: ["1.36"]

  cluster:
    allowed_regions: [us-east-1]

  # Perfiles definidos por Platform Engineering
  nodegroups:
    system:
      sizes:
        S: m7i.large
        M: m7i.xlarge
      default_size: S
      allowed_capacity_types: [ON_DEMAND]
      min_count: 1
      max_count: 2

    user:
      sizes:
        S: m7i.xlarge
        M: m7i.2xlarge
      default_size: S
      allowed_capacity_types: [ON_DEMAND]
      min_count: 1
      max_count: 2

    limits:
      max_total_nodes: 4

  # Pendiente de definición por Networking
  networking:
    conformity: pending
    approved_options: {}
